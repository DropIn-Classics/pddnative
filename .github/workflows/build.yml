# Builds the port (port/) for Windows, Linux and macOS and packs each with
# port/dist/README.txt and the licences of micromod (and of SDL2, which
# the Linux package carries beside the program and the macOS app has
# linked in).  A push of a tag v* also makes a GitHub release with the
# three packages and latest.json, which the releases look for (the setup
# screen's "New versions", port/src/update.h).  Nothing here needs the
# game's data: the tools' checks (tools/check.py) run on a clone with the
# game unpacked, not here.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # a tag's build carries its name as the version (port/build.sh)
  PORT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # where a release looks for newer ones: the latest release's latest.json
  # (port/src/update.h) in DropIn-Classics, the ports' public home.  The
  # repository is moved there at its first public release, so what is
  # built into a release names it, not the repository the build ran in;
  # before the move nothing is found and nothing is shown.
  PORT_UPDATE_URL: https://github.com/DropIn-Classics/${{ github.event.repository.name }}/releases/latest/download/latest.json

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: call port\build.bat
      - name: Pack
        shell: pwsh
        run: |
          $d = "pddnative-windows-x64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item port\build\pdd.exe, port\dist\README.txt $d
          Copy-Item port\third_party\micromod\LICENCE.txt $d\LICENCE-micromod.txt
          Compress-Archive $d "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pddnative-windows-x64
          path: pddnative-windows-x64.zip

  linux:
    # the oldest runner there is, so that the program runs on older glibcs
    runs-on: ubuntu-22.04
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL2
        # SDL's release built here, not the distribution's: it loads X11,
        # Wayland, PulseAudio, PipeWire and ALSA only when it finds them, so
        # the package runs where no SDL2 is installed (the Steam Deck's
        # read-only system among them); the headers are needed to build it
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev patchelf
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz | tar xz
          cmake -S SDL2-$SDL2_VERSION -B sdl2build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2" -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl2build -j4
          cmake --install sdl2build
          echo "$PWD/sdl2/bin" >> "$GITHUB_PATH"
      - name: Build
        run: sh port/build.sh
      - name: Pack
        run: |
          test -x port/build/pdd
          d=pddnative-linux-x64
          mkdir $d
          cp port/build/pdd port/dist/README.txt $d/
          cp -L sdl2/lib/libSDL2-2.0.so.0 $d/
          # sdl2-config's search path is this machine's: only pdd's own folder
          patchelf --set-rpath '$ORIGIN' $d/pdd
          cp port/third_party/micromod/LICENCE.txt $d/LICENCE-micromod.txt
          cp SDL2-$SDL2_VERSION/LICENSE.txt $d/LICENCE-SDL2.txt
          tar czf $d.tar.gz $d
      - name: Show what the package needs
        # the libraries it links and the newest glibc symbol version it uses;
        # ldd with the system's SDL2 absent must find libSDL2 beside pdd
        run: |
          d=pddnative-linux-x64
          readelf -d $d/pdd $d/libSDL2-2.0.so.0 | grep -E 'NEEDED|RUNPATH|RPATH|^File'
          objdump -T $d/pdd $d/libSDL2-2.0.so.0 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          mv sdl2 sdl2.away
          ldd $d/pdd | tee ldd.txt
          if grep -q 'not found' ldd.txt; then exit 1; fi
          grep -q "libSDL2-2.0.so.0 => $PWD/$d/libSDL2-2.0.so.0" ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pddnative-linux-x64
          path: pddnative-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    env:
      SDL2_VERSION: 2.32.10
      # the oldest macOS SDL2 and the program are built for (arm64: 11)
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL2
        # SDL's release built as a static library for x86_64 and arm64 and
        # linked into pdd: the app has nothing beside the program that
        # Gatekeeper would block on its own
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz | tar xz
          cmake -S SDL2-$SDL2_VERSION -B sdl2build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_INSTALL_PREFIX="$PWD/sdl2" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          cmake --build sdl2build -j4
          cmake --install sdl2build
          echo "$PWD/sdl2/bin" >> "$GITHUB_PATH"
      - name: Build
        run: CC="cc -arch x86_64 -arch arm64" SDL2_STATIC=1 sh port/build.sh
      - name: Pack
        run: |
          test -x port/build/pdd
          d=pddnative-macos
          mkdir $d
          sh port/dist/macapp.sh $d
          cp port/dist/README.txt $d/
          cp port/third_party/micromod/LICENCE.txt $d/LICENCE-micromod.txt
          cp SDL2-$SDL2_VERSION/LICENSE.txt $d/LICENCE-SDL2.txt
          ditto -c -k --keepParent $d $d.zip
      - name: Show what the package needs
        # only the system's libraries and frameworks, both architectures
        run: |
          p=pddnative-macos/pddnative.app/Contents/MacOS/pdd
          lipo -info $p
          otool -L $p
          if otool -L $p | grep -qi sdl; then exit 1; fi
          codesign --verify --deep --strict -v pddnative-macos/pddnative.app
      - uses: actions/upload-artifact@v4
        with:
          name: pddnative-macos
          path: pddnative-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: latest.json
        # what update.h fetches: the version, the release's page, the
        # annotated tag's message as the players' notes (none for a
        # lightweight tag), each package's name and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          notes=""
          if [ "$(echo "$ref" | jq -r .object.type)" = tag ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" \
              | jq -r .message | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          fi
          pkg() { jq -n --arg f "$1" --arg h "$(sha256sum "$1" | cut -d' ' -f1)" '{file: $f, sha256: $h}'; }
          jq -n --arg v "$GITHUB_REF_NAME" \
            --arg p "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg n "$notes" \
            --argjson w "$(pkg pddnative-windows-x64.zip)" \
            --argjson l "$(pkg pddnative-linux-x64.tar.gz)" \
            --argjson m "$(pkg pddnative-macos.zip)" \
            '{version: $v, page: $p, notes: $n,
              packages: {"windows-x64": $w, "linux-x64": $l, macos: $m}}' > latest.json
          cat latest.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --generate-notes
          pddnative-windows-x64.zip pddnative-linux-x64.tar.gz pddnative-macos.zip latest.json
